<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>robrob gallery mapmap (WIP)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --bg:#faf8f4; --fg:#1d1b18; --muted:#6b665e; --line:#e4dfd6; --accent:#c2410c; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16140f; --fg:#f1ede6; --muted:#a39d92; --line:#2c2922; --accent:#fb923c; --card:#1f1c16; } }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui, -apple-system, sans-serif; }
  .wrap { display:flex; height:100%; }
  aside { width:300px; flex:none; overflow-y:auto; border-right:1px solid var(--line); padding:16px; }
  #map { flex:1; }
  h1 { font-size:18px; margin:0 0 4px; }
  .wip { display:inline-block; font-size:11px; font-weight:700; letter-spacing:.05em; background:var(--accent); color:#fff; border-radius:4px; padding:1px 6px; vertical-align:middle; margin-left:6px; }
  p.sub { margin:0 0 12px; color:var(--muted); font-size:13px; }
  ol { list-style:none; padding:0; margin:0; }
  li { padding:10px; border:1px solid var(--line); border-radius:8px; margin-bottom:8px; background:var(--card); cursor:pointer; display:flex; gap:10px; }
  li:hover { border-color:var(--accent); }
  .n { flex:none; width:24px; height:24px; border-radius:50%; background:var(--accent); color:#fff; font-weight:700; font-size:12px; display:grid; place-items:center; }
  .name { font-weight:600; }
  .show { font-style:italic; }
  .addr { color:var(--muted); font-size:12px; }
  .pin { width:26px; height:26px; border-radius:50%; background:var(--accent); color:#fff; font-weight:700; font-size:12px; display:grid; place-items:center; border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.4); }
  .me { width:16px; height:16px; border-radius:50%; background:#2563eb; border:3px solid #fff; box-shadow:0 0 0 2px rgba(37,99,235,.35), 0 1px 4px rgba(0,0,0,.4); }
  .locate { position:absolute; right:10px; bottom:24px; z-index:1000; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:8px 12px; font:600 14px system-ui, sans-serif; box-shadow:0 1px 4px rgba(0,0,0,.25); cursor:pointer; }
  .card { position:absolute; left:10px; top:10px; z-index:1001; width:min(340px, calc(100% - 20px)); max-height:calc(100% - 80px); overflow-y:auto; background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:12px; padding:14px 14px 12px; box-shadow:0 4px 20px rgba(0,0,0,.25); }
  .card[hidden] { display:none; }
  .card .close { position:absolute; top:6px; right:8px; border:0; background:none; color:var(--muted); font-size:24px; line-height:1; cursor:pointer; padding:4px; }
  .card-head { display:flex; gap:10px; align-items:center; padding-right:24px; }
  .card h2 { font-size:17px; margin:0; }
  .card .label { margin-top:12px; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .card ul.shows { margin:4px 0 10px; padding-left:18px; }
  .card ul.shows li { display:list-item; border:0; padding:2px 0; margin:0; background:none; cursor:auto; font-style:italic; }
  .card ul.shows li.unknown { font-style:normal; color:var(--muted); list-style:none; margin-left:-18px; }
  .photo { margin:10px -14px 0; aspect-ratio:21/9; background:var(--line) center/cover no-repeat; display:none; }
  .photo.ok { display:block; }
  .credit { font-size:10px; color:var(--muted); text-align:right; margin-top:2px; display:none; }
  .credit.ok { display:block; }
  .btns { display:flex; gap:8px; margin-top:12px; }
  .btn { flex:1; text-align:center; text-decoration:none; padding:9px 10px; border-radius:8px; border:1px solid var(--line); color:var(--fg); font-weight:600; font-size:14px; }
  .btn:visited { color:var(--fg); }
  .btn.primary, .btn.primary:visited { background:var(--accent); border-color:var(--accent); color:#fff; }
  .tick { flex:none; margin-left:auto; align-self:center; width:32px; height:32px; border-radius:50%; border:2px solid var(--line); background:none; color:transparent; font-size:16px; font-weight:700; cursor:pointer; display:grid; place-items:center; }
  .tick.on { background:#16a34a; border-color:#16a34a; color:#fff; }
  li.been { opacity:.6; }
  li.been .n, .pin.been { background:#16a34a; }
  #count { font-weight:700; color:var(--fg); }
  .been-btn { width:100%; margin-top:8px; padding:9px 10px; border-radius:8px; border:2px solid #16a34a; background:none; color:#16a34a; font:600 14px system-ui, sans-serif; cursor:pointer; }
  .been-btn.on { background:#16a34a; color:#fff; }
  #map { position:relative; }
  @media (max-width: 700px) {
    .wrap { flex-direction:column-reverse; }
    aside { width:100%; height:40%; border-right:0; border-top:1px solid var(--line); }
  }
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <h1>robrob gallery mapmap <span class="wip">WIP</span></h1>
    <p class="sub">Tap a place or pin to see what’s on. Tick the ones you’ve been to. <span id="count"></span></p>
    <ol id="list"></ol>
  </aside>
  <div id="map"><button class="locate" id="locate" type="button">📍 Where am I?</button>
    <div class="card" id="card" hidden><button class="close" type="button" aria-label="Close">×</button><div class="card-body"></div></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const places = [
  { name:"Annely Juda Fine Art", wiki:"Annely Juda", addr:"16 Hanover Square, W1S 1HT", ll:[51.5136,-0.1428], url:"https://www.annelyjudafineart.co.uk/exhibitions/current" },
  { name:"Serpentine Galleries", wiki:"Serpentine Galleries", addr:"Kensington Gardens, W2 3XA", ll:[51.5048,-0.1749], url:"https://www.serpentinegalleries.org/whats-on/" },
  { name:"Whitechapel Gallery", wiki:"Whitechapel Gallery", addr:"77–82 Whitechapel High St, E1 7QX", ll:[51.5160,-0.0703], url:"https://www.whitechapelgallery.org", shows:["Cecilia Vicuña: Foraging Quipu","Cecilia Vicuña: Living Threads","This Must Be the Place: Artists for Whitechapel Gallery"] },
  { name:"Pilar Corrias", wiki:"Pilar Corrias", addr:"2 Savile Row, W1S 3PA", ll:[51.5108,-0.1406], url:"https://www.pilarcorrias.com", shows:["Rirkrit Tiravanija: (situational awareness)"] },
  { name:"Sprüth Magers", wiki:"Sprüth Magers", addr:"7A Grafton St, W1S 4EJ", ll:[51.5089,-0.1424], url:"https://spruethmagers.com", shows:["Hyun-Sook Song (opens 6 Nov)"] },
  { name:"Gagosian, Grosvenor Hill", wiki:"Gagosian", addr:"20 Grosvenor Hill, W1K 3QD", ll:[51.5115,-0.1458], url:"https://gagosian.com/exhibitions/", shows:["This Is Still Not a Pipe: The Afterlife of Magritte"] },
  { name:"Somerset House Studios", wiki:"Somerset House", addr:"Strand, WC2R 1LA", ll:[51.5111,-0.1171], url:"https://www.somersethouse.org.uk/whats-on", shows:["Jenkin van Zyl: Enclosure"] },
  { name:"Elizabeth Xi Bauer", wiki:"Elizabeth Xi Bauer", addr:"Exmouth Market, EC1R", ll:[51.5258,-0.1087], url:"https://elizabethxibauer.com", shows:["Pia Camil: Bestia"] },
  { name:"Robilant+Voena", wiki:"Robilant+Voena", addr:"38 Dover St, W1S 4NL", ll:[51.5085,-0.1418], url:"https://www.robilantvoena.com" },
  { name:"Barbican, The Curve", wiki:"Barbican Centre", addr:"Silk St, EC2Y 8DS", ll:[51.5202,-0.0937], url:"https://www.barbican.org.uk/whats-on/art-design", shows:["Yuko Mohri"] },
  { name:"Emalin", wiki:"Emalin", addr:"The Clerk's House, 118½ Shoreditch High St, E1 6JN", ll:[51.5254,-0.0777], url:"https://emalin.co.uk/exhibitions/pilgrims", shows:["Pilgrims"] },
  { name:"White Cube Bermondsey", wiki:"White Cube", addr:"144–152 Bermondsey St, SE1 3TQ", ll:[51.4977,-0.0817], url:"https://www.whitecube.com/gallery-exhibitions/gabriel-orozco-bermondsey-2026", shows:["Gabriel Orozco: Chronotopic"] },
  { name:"Hamiltons Gallery", wiki:"Hamiltons Gallery", addr:"13 Carlos Place, W1K 2EU", ll:[51.5103,-0.1497], url:"https://www.hamiltonsgallery.com" },
  { name:"Quentin Blake Centre for Illustration", wiki:"Quentin Blake Centre for Illustration", addr:"1 Myddelton Passage, EC1R 1AG", ll:[51.5300,-0.1065], url:"https://www.quentinblakecentre.org", shows:["Quentin Blake: Performance"] },
];
const map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'&copy; OpenStreetMap contributors' }).addTo(map);
const list = document.getElementById('list');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const card = document.getElementById('card');
// Ticks are saved in this browser only, so they're private to you on this device.
const KEY = 'robrob-mapmap-been';
let been = {};
try { been = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
const markers = [], items = [];
let openIdx = -1;
function setBeen(i, v) {
  if (v) been[places[i].name] = true; else delete been[places[i].name];
  try { localStorage.setItem(KEY, JSON.stringify(been)); } catch (e) {}
  render(i);
  if (openIdx === i) openCard(i);
}
function render(i) {
  const on = !!been[places[i].name];
  items[i].classList.toggle('been', on);
  const t = items[i].querySelector('.tick');
  t.classList.toggle('on', on); t.setAttribute('aria-pressed', on); t.textContent = '✓';
  const el = markers[i].getElement();
  if (el) el.querySelector('.pin').classList.toggle('been', on);
  const n = places.filter(p => been[p.name]).length;
  document.getElementById('count').textContent = `${n}/${places.length} visited`;
}
function openCard(i) {
  const p = places[i];
  const gmaps = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.name + ', ' + p.addr + ', London');
  const shows = p.shows && p.shows.length
    ? p.shows.map(t => `<li>${esc(t)}</li>`).join('')
    : '<li class="unknown">Not sure what’s on. Check their website.</li>';
  card.querySelector('.card-body').innerHTML =
    `<div class="card-head"><span class="n">${i+1}</span><h2>${esc(p.name)}</h2></div>
     <div class="photo"></div><div class="credit">Photo: Wikipedia</div>
     <div class="label">On now</div><ul class="shows">${shows}</ul>
     <div class="addr">${esc(p.addr)}</div>
     <button class="been-btn${been[p.name]?' on':''}" type="button">${been[p.name]?'✓ Been here':'Tick: I’ve been here'}</button>
     <div class="btns"><a class="btn primary" href="${p.url}" target="_blank" rel="noopener">Website ↗</a><a class="btn" href="${gmaps}" target="_blank" rel="noopener">Directions ↗</a></div>`;
  card.querySelector('.been-btn').onclick = () => setBeen(i, !been[p.name]);
  openIdx = i;
  card.hidden = false;
  loadPhoto(i);
}
// Photos load from Wikipedia on your phone; if there's no photo the space just stays hidden.
const photoCache = {};
async function loadPhoto(i) {
  const p = places[i];
  if (p.img) return showPhoto(i, p.img, 'Photo: ' + (p.imgCredit || p.name));
  if (!p.wiki) return;
  if (!(p.wiki in photoCache)) {
    photoCache[p.wiki] = null;
    try {
      const r = await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(p.wiki.replace(/ /g, '_')) + '?redirect=true');
      if (r.ok) { const j = await r.json(); if (j.type !== 'disambiguation') photoCache[p.wiki] = (j.originalimage || j.thumbnail || {}).source || null; }
    } catch (e) {}
  }
  if (photoCache[p.wiki]) showPhoto(i, photoCache[p.wiki], 'Photo: Wikipedia');
}
function showPhoto(i, src, credit) {
  if (openIdx !== i) return;
  const img = new Image();
  img.onload = () => {
    if (openIdx !== i) return;
    const ph = card.querySelector('.photo'), cr = card.querySelector('.credit');
    ph.style.backgroundImage = `url("${src}")`; ph.classList.add('ok');
    cr.textContent = credit; cr.classList.add('ok');
  };
  img.src = src;
}
card.querySelector('.close').onclick = () => { card.hidden = true; openIdx = -1; };
L.DomEvent.disableClickPropagation(card);
map.on('click', () => { card.hidden = true; openIdx = -1; });
places.forEach((p,i) => {
  const icon = L.divIcon({ className:'', html:`<div class="pin">${i+1}</div>`, iconSize:[26,26], iconAnchor:[13,13] });
  markers[i] = L.marker(p.ll, { icon }).addTo(map).on('click', () => openCard(i));
  const li = document.createElement('li');
  const first = p.shows && p.shows[0];
  li.innerHTML = `<span class="n">${i+1}</span><div><div class="name">${esc(p.name)}</div>${first?`<div class="show">${esc(first)}${p.shows.length>1?` +${p.shows.length-1} more`:''}</div>`:''}<div class="addr">${esc(p.addr)}</div></div><button class="tick" type="button" aria-label="Been here">✓</button>`;
  li.querySelector('.tick').onclick = e => { e.stopPropagation(); setBeen(i, !been[p.name]); };
  li.onclick = () => { map.setView(p.ll, 16); openCard(i); };
  list.appendChild(li);
  items[i] = li;
  render(i);
});
map.fitBounds(L.latLngBounds(places.map(p => p.ll)), { padding:[30,30] });
places.forEach((_, i) => render(i));

// Your location stays on this device: it is only drawn on the map, never sent or saved.
let meMarker = null, meCircle = null, firstFix = true, watching = false;
const btn = document.getElementById('locate');
L.DomEvent.disableClickPropagation(btn);
function startLocating() {
  if (!('geolocation' in navigator)) { btn.textContent = 'Location unavailable'; return; }
  if (watching) { if (meMarker) map.setView(meMarker.getLatLng(), 15); return; }
  watching = true;
  btn.textContent = 'Finding you…';
  navigator.geolocation.watchPosition(pos => {
    const ll = [pos.coords.latitude, pos.coords.longitude];
    if (!meMarker) {
      meMarker = L.marker(ll, { icon: L.divIcon({ className:'', html:'<div class="me"></div>', iconSize:[22,22], iconAnchor:[11,11] }), zIndexOffset:1000 }).addTo(map).bindPopup('You are here');
      meCircle = L.circle(ll, { radius: pos.coords.accuracy, color:'#2563eb', weight:1, fillOpacity:.1 }).addTo(map);
    } else { meMarker.setLatLng(ll); meCircle.setLatLng(ll).setRadius(pos.coords.accuracy); }
    btn.textContent = '📍 Me';
    if (firstFix) { firstFix = false; map.fitBounds(L.latLngBounds(places.map(p => p.ll).concat([ll])), { padding:[30,30], maxZoom:15 }); }
  }, err => {
    watching = false;
    btn.textContent = err.code === 1 ? 'Location blocked' : '📍 Try again';
  }, { enableHighAccuracy:true, maximumAge:10000, timeout:20000 });
}
btn.onclick = startLocating;
startLocating();
</script>
</body>
</html>
